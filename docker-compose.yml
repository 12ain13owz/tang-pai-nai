# Run the API and the web app together, built like they ship, to test on this PC before Vercel.
# Pick one profile (they can also run side by side, on different ports):
#
#   docker compose --profile dev up --build      # http://localhost:8080  no keys, codes in the API log
#   docker compose --profile staging up --build  # http://localhost:8081  staging's real services
#
# `dev` keeps a SQLite database in a Docker volume (test users only). `staging` uses
# api/.env.staging: the same file that is imported into Vercel's Preview environment, so what
# works here works on staging (Turso, Resend, Turnstile). Migrations run every time the API
# starts: on `staging` that migrates the staging database. Commands: README → Docker.

x-api: &api
  build:
    context: ./api
  restart: on-failure:3
  # Apply pending migrations, then start the API (`exec` so SIGTERM reaches node).
  command: ['sh', '-c', 'node dist/core/database/migrate.js && exec node dist/main.js']
  healthcheck:
    # node's built-in fetch: the slim image has neither curl nor wget.
    test:
      - CMD
      - node
      - -e
      - "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 10s

x-web: &web
  build:
    context: ./web
  restart: on-failure:3

services:
  # ── dev: development settings, no API keys ─────────────────────────────────────────────────────
  api-dev:
    <<: *api
    profiles: [dev]
    env_file: [./api/.env.dev]
    # These win over the env file: the browser reaches the API only through the web's /api proxy.
    environment:
      PORT: '3000'
      BASE_URL: http://localhost:8080/api
      WEB_ORIGIN: http://localhost:8080
      DATABASE_URL: file:./data/local.db
      DATABASE_AUTH_TOKEN: ''
    volumes:
      - api-dev-data:/app/data
      # Development mode refuses to start without the file on disk (core/config/env/env.ts); the
      # values themselves come from env_file above.
      - ./api/.env.dev:/app/.env.dev:ro

  web-dev:
    <<: *web
    profiles: [dev]
    environment:
      API_UPSTREAM: http://api-dev:3000
    ports: ['8080:80']
    depends_on:
      api-dev:
        condition: service_healthy

  # ── staging: staging's real keys and database from api/.env.staging (also imported into Vercel) ─
  api-staging:
    <<: *api
    profiles: [staging]
    env_file: [./api/.env.staging]
    # Only the addresses change, so links in mails open this local copy. Everything else, the Turso
    # database included, is staging's own: the migrations at start run against it.
    environment:
      NODE_ENV: production
      PORT: '3000'
      BASE_URL: http://localhost:8081/api
      WEB_ORIGIN: http://localhost:8081

  web-staging:
    <<: *web
    profiles: [staging]
    environment:
      API_UPSTREAM: http://api-staging:3000
    ports: ['8081:80']
    depends_on:
      api-staging:
        condition: service_healthy

volumes:
  api-dev-data:
