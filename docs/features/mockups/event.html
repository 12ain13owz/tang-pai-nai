  dots: '<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',
  cloud: '<path d="M17.5 19H9a7 7 0 1 1 6.7-9h1.8a4.5 4.5 0 1 1 0 9Z"/><path d="m9 14 2 2 4-4"/>',
  list: '<path d="M3 12h.01M3 18h.01M3 6h.01M8 12h13M8 18h13M8 6h13"/>', chart: '<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M7 16h3v-5H7zM14 16h3V8h-3z"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>',
  bell: '<path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/><path d="M3.3 15.3A1 1 0 0 0 4 17h16a1 1 0 0 0 .7-1.7C19.4 14 18 12.5 18 8A6 6 0 0 0 6 8c0 4.5-1.4 6-2.7 7.3"/>',
  check: '<path d="M20 6 9 17l-5-5"/>', alert: '<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',
  eye: '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
  hand: '<path d="M11 15h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 17"/><path d="m7 21 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9"/><path d="m2 16 6 6"/><circle cx="16" cy="9" r="2.9"/><circle cx="6" cy="5" r="3"/>',
  bag: '<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
  pencil: '<path d="M21.2 6.8a1 1 0 0 0-4-4L3.8 16.2a2 2 0 0 0-.5.8l-1.3 4.4a.5.5 0 0 0 .6.6l4.4-1.3a2 2 0 0 0 .8-.5z"/>',
  percent: '<path d="M19 5 5 19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  card: '<rect width="20" height="14" x="2" y="5" rx="2"/><path d="M2 10h20"/>',
  plane: '<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',
  tent: '<path d="M3.5 21 14 3"/><path d="M20.5 21 10 3"/><path d="M15.5 21 12 15l-3.5 6"/><path d="M2 21h20"/>',
  gift: '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',
  bed: '<path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/>',
  car: '<path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10l-2.7-3.4A2 2 0 0 0 11.7 6H6.3a2 2 0 0 0-1.6.8L2 10v6c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M9 17h6"/>',
  lock: '<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
}
const ic = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24">${I[n]}</svg>`
const badge = (c, n, w) => `<div class="badge" style="background:${c}">${ic(n)}${w ? `<span class="w" style="background:${w[0]}">${ic(w[1])}</span>` : ''}</div>`
const mbadge = (n, w) => `<div class="badge m">${ic(n)}${w ? `<span class="w" style="background:${w[0]}">${ic(w[1])}</span>` : ''}</div>`
const fmt = (v, sign = true) => (v < 0 ? '−' : sign && v > 0 ? '+' : '') + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2 })
const C = { food: '#c2410c', shop: '#be185d', bill: '#0369a1', other: '#475569', pay: '#15803d' }
const W = { cash: ['#15803d', 'wallet'], bank: ['#1d4ed8', 'bank'], save: ['#be185d', 'piggy'], card: ['#7c3aed', 'card'] }

const header = () => `<div class="hdr"><div class="l"><div class="ib">${ic('user')}</div></div>
  <div class="pill"><div class="badge" style="width:26px;height:26px;background:#1d4ed8">${ic('wallet')}</div> ทุกกระเป๋า ${ic('chevD', 's')}</div>
  <div class="r"><div class="ib ok">${ic('cloud')}</div><div class="ib">${ic('dots')}</div></div></div>`
const pageHdr = (t, right = '', back = true) => `<div class="hdr"><div class="l">${back ? `<div class="ib">${ic('chevL')}</div>` : ''}</div><div class="ttl">${t}</div><div class="r">${right}<div class="ib ok">${ic('cloud')}</div></div></div>`
const tabbar = (on = 0) => `<div class="tabbar">${[['list', 'ธุรกรรม'], ['wallet', 'กระเป๋า'], null, ['chart', 'รายงาน'], ['user', 'บัญชี']].map((t, i) =>
  t ? `<div class="${i === on ? 'on' : ''}">${ic(t[0])}${t[1]}</div>` : `<div><div class="plus">${ic('plus')}</div></div>`).join('')}</div>`
const chips = (list, on) => `<div class="chips">${list.map((c) => `<span class="chip ${c === on ? 'on' : ''}">${c}</span>`).join('')}</div>`
const sheet = (left, title, right, body, foot, extra = '') => `<div class="dim"></div><div class="sheet"><div class="grab"></div>
  <div class="shdr"><div class="ib">${ic(left)}</div><div class="ttl">${title}</div><div class="r">${right}</div></div>
  <div class="sbody">${body}</div>${foot ? `<div class="sfoot">${foot}</div>` : ''}${extra}</div>`
const tx = (b, name, sub, amt, opts = {}) => `<div class="tx">${b}<div class="mid">${name}${opts.link ? `<span class="rep">${ic('hand', 's')}</span>` : ''}
  ${sub ? `<small>${sub}</small>` : ''}</div><div class="amt ${amt < 0 ? 'exp' : 'inc'}">${fmt(amt)}${opts.amtSub ? `<small>${opts.amtSub}</small>` : ''}</div></div>`
const day = (n, w, my, total, rows) => `<div class="card day"><div class="dayh"><div class="n">${n}</div><div class="w"><b>${w}</b>${my}</div>
  <div class="t ${total < 0 ? 'exp' : 'inc'}">${total === null ? '' : fmt(total)}</div></div>${rows.join('')}</div>`
const keypad = (chipsHtml = '') => `${chipsHtml}<div class="keypad">${['C', '÷', '×', '⌫', '7', '8', '9', '−', '4', '5', '6', '+', '1', '2', '3', '=', '000', '0', '.', '✓'].map((k) => `<span>${k}</span>`).join('')}</div>`
const debtRow = (b, name, sub, left, of, amt, side, opts = {}) => `<div class="rule ${opts.done ? 'done' : ''}">${b}<div class="mid">${name}${opts.tag ? ` <span class="tag ${opts.tagB ? 'b' : ''}">${opts.tag}</span>` : ''}
  <small>${sub}</small>${of ? `<div class="prog ${side === 'inc' ? 'inc' : ''}"><i style="width:${Math.round((1 - left / of) * 100)}%"></i></div>` : ''}</div>
  <div class="amt ${opts.done ? '' : side}">${fmt(amt, false)}<small class="${opts.late ? 'warn' : ''}">${opts.when ?? ''}</small></div></div>`
const ent = (b, name, sub, amt, opts = {}) => `<div class="ent">${b}<div class="mid">${name}${opts.tag ? ` <span class="tag ${opts.tagB ? 'b' : ''}">${opts.tag}</span>` : ''}<small>${sub}</small></div>
  <div class="amt ${amt < 0 ? 'exp' : amt > 0 ? 'inc' : ''}">${fmt(amt)}${opts.amtSub ? `<small>${opts.amtSub}</small>` : ''}</div></div>`
const EV = { trip: ['#0e7490', 'plane'], camp: ['#4d7c0f', 'tent'], wed: ['#be185d', 'gift'] }
const evRow = (e, name, sub, spent, opts = {}) => `<div class="rule ${opts.done ? 'done' : ''}">${badge(e[0], e[1])}<div class="mid">${name}${opts.tag ? ` <span class="tag b">${opts.tag}</span>` : ''}<small>${sub}</small></div>
  <div class="amt exp">${fmt(-spent)}<small>${opts.n ?? ''}</small></div>${ic('chevR', 's')}</div>`
const evTag = (t) => `<span class="tag b">${ic('plane', 's')} ${t}</span>`

const frames = [
  ['1 · หน้า "อีเวนต์ / ทริป" (Q2, Q6)', 'เข้าจากเมนู ⋮ แท็บธุรกรรม หรือ บัญชี › ข้อมูลของฉัน. <b>ยังไม่จบ</b> เรียงตามวันเริ่ม (ล่าสุดบน), แถว: ชื่อ, ช่วงวันที่, ยอดจ่าย + จำนวนรายการ. "กำลังใช้" = วันนี้อยู่ในช่วงวัน (รายการใหม่จะผูกให้เอง, Q7). <b>จบแล้ว</b> พับไว้. ปุ่มเพิ่มใต้รายการ.',
    () => pageHdr('อีเวนต์ / ทริป') + `<div class="scroll">
      <div class="h">ยังไม่จบ (2)</div>
      <div class="card">
        ${evRow(EV.trip, 'เชียงใหม่', '7 – 12 พ.ย. 2026', 18450, { tag: 'กำลังใช้', n: '23 รายการ' })}
        ${evRow(EV.wed, 'งานแต่งน้องเอ', 'ตั้งแต่ 1 ต.ค. 2026', 32000, { n: '6 รายการ' })}
      </div>
      <div class="fold"><span>จบแล้ว (1)</span>${ic('chevD', 's')}</div>
      <div class="card">${evRow(EV.camp, 'เขาใหญ่', '14 – 16 ส.ค. 2026', 6120, { done: true, n: '11 รายการ' })}</div>
      <button class="btn ol" style="flex:none">${ic('plus', 's')} เพิ่มอีเวนต์</button>
    </div>` + tabbar(0)],
  ['2 · หน้าอีเวนต์ (Q3, Q5)', 'ยอด <b>จ่าย</b> ใหญ่ + รับ / สุทธิ (นับทุกรายการที่ผูก รวม "ไม่นับในรายงาน"; หลายสกุลเงิน = บรรทัดละสกุล). <b>ตามหมวด</b> (จ่าย) แล้ว <b>รายการ</b> เรียงตามวัน (แตะ = แก้ธุรกรรม). ✎ แก้อีเวนต์, ปุ่ม "จบทริป" / "เปิดอีกครั้ง".',
    () => pageHdr('เชียงใหม่', `<div class="ib">${ic('pencil')}</div>`) + `<div class="scroll">
      <div class="card hero"><small>จ่ายทั้งหมด · 7 – 12 พ.ย. 2026</small><div class="big exp">18,450.00</div>
        <div class="facts"><span>รับ <b class="inc">+500.00</b> · สุทธิ <b class="exp">−17,950.00</b></span><span>23 รายการ · 3 กระเป๋า</span></div></div>
      <div class="acts"><button class="btn ol">${ic('check', 's')} จบทริป</button><button class="btn t">${ic('plus', 's')} เพิ่มรายการ</button></div>
      <div class="h">ตามหมวด</div>
      <div class="card">
        <div class="rule">${badge('#0369a1', 'bed')}<div class="mid">ที่พัก<div class="prog"><i style="width:46%"></i></div></div><div class="amt">8,400.00<small>46%</small></div></div>
        <div class="rule">${badge(C.food, 'drop')}<div class="mid">อาหาร<div class="prog"><i style="width:31%"></i></div></div><div class="amt">5,690.00<small>31%</small></div></div>
        <div class="rule">${badge('#475569', 'car')}<div class="mid">เดินทาง<div class="prog"><i style="width:23%"></i></div></div><div class="amt">4,360.00<small>23%</small></div></div>
      </div>
      <div class="h">รายการ</div>
      ${day(9, 'วันจันทร์', 'พฤศจิกายน 2026', -1240, [tx(badge(C.food, 'drop'), 'อาหาร', 'เงินสด · ข้าวซอย', -240), tx(badge('#475569', 'car'), 'เดินทาง', 'กสิกร · เช่ารถ', -1000)])}
    </div>` + tabbar(0)],
  ['3 · ชีตเพิ่ม / แก้อีเวนต์ (Q2, Q9, Q11)', 'ชื่อ (≤ 50) + ไอคอน/สี, <b>วันเริ่ม</b> (ต้องมี, ค่าเริ่ม = วันนี้), <b>วันจบ</b> (ไม่มีก็ได้). ตอนแก้: ปุ่มลบในหัว → ยืนยัน "ธุรกรรม n รายการจะยังอยู่ แค่ไม่ผูกกับอีเวนต์". ยังไม่จบได้ไม่เกิน 50 อันต่อโปรไฟล์.',
    () => pageHdr('อีเวนต์ / ทริป') + `<div class="scroll"></div>` + sheet('x', 'เพิ่มอีเวนต์', '', `
      <div class="card rows"><div>${badge(EV.trip[0], 'plane')}<div class="lbl"><input class="nm" value="เชียงใหม่"></div></div></div>
      <div class="card rows">
        <div>${ic('cal')}<div class="lbl">วันเริ่ม</div><div class="val on">ส. 7 พ.ย. 2026</div></div>
        <div>${ic('calEnd')}<div class="lbl">วันจบ<small>ไม่ใส่ = ยังไม่กำหนด</small></div><div class="val">พฤ. 12 พ.ย. 2026 ${ic('x', 's')}</div></div>
      </div>
      <div class="hint">ระหว่างวันเริ่มถึงวันจบ รายการใหม่ที่วันที่อยู่ในช่วงนี้จะผูกกับอีเวนต์ให้เอง (เอาออกได้ในฟอร์ม)</div>`,
      `<button class="btn">บันทึก</button>`)],
  ['4 · ฟอร์มธุรกรรม + แท็บธุรกรรม (Q4, Q7)', 'ฟอร์มมีแถว <b>อีเวนต์</b> (ใต้วันที่): ค่าเริ่มได้เองเมื่อวันที่อยู่ในช่วงของอีเวนต์ที่ยังไม่จบ (หลายอัน = อันที่เริ่มล่าสุด), แตะ = เลือกอื่น / "ไม่ผูก". เปลี่ยนวันที่แล้วค่าเริ่มเปลี่ยนตาม จนกว่าจะเลือกเอง. การโอน / รายการหนี้ไม่มีแถวนี้. ในแท็บธุรกรรมแถวที่ผูกมีป้ายชื่ออีเวนต์.',
    () => header() + `<div class="scroll">${day(9, 'วันจันทร์', 'พฤศจิกายน 2026', -240, [tx(badge(C.food, 'drop'), 'อาหาร', `เงินสด · ${evTag('เชียงใหม่')}`, -240)])}</div>` + sheet('x', 'เพิ่มธุรกรรม', '', `
      <div class="seg"><span>รายรับ</span><span class="on">รายจ่าย</span></div>
      <div class="card rows amtrow"><div><span class="code">THB</span><div class="lbl big exp" style="text-align:right">350</div></div></div>
      <div class="card rows">
        <div>${badge(C.food, 'drop')}<div class="lbl">อาหาร</div>${ic('chevR', 's')}</div>
        <div>${badge(W.cash[0], 'wallet')}<div class="lbl">เงินสด</div>${ic('chevR', 's')}</div>
        <div>${ic('cal')}<div class="lbl">วันนี้</div><div class="val">จ. 9 พ.ย. 2026</div></div>
        <div>${ic('plane')}<div class="lbl">อีเวนต์</div><div class="val on">เชียงใหม่ ${ic('x', 's')}</div></div>
        <div>${ic('note')}<div class="lbl mut">โน้ต</div></div>
      </div>`, `<button class="btn">บันทึก</button>`)],
]
document.getElementById('grid').innerHTML = frames.map(([t, d, f]) =>
  `<figure><figcaption><b>${t}</b><br>${d}</figcaption><div class="phone">${f()}</div></figure>`).join('')
</script>
</body>
</html>
