services:
  nodejs:
    profiles: [prod]
    build:
      context: .
      dockerfile: Dockerfile
    image: tang-pai-nai-api-img
    container_name: tang-pai-nai-api
    restart: on-failure:3
    env_file:
      - .env.prod
    ports:
      - '3000:3000'
    healthcheck:
      # Uses node's built-in fetch: the slim image has neither curl nor wget.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
