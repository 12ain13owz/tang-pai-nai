get:
  tags:
    - Sync
  summary: Pull changed rows
  description: >-
    Every row the caller may sync with `changeSeq > since`, across tables, plus conflict notices
    for this device (docs/features/offline-sync.md rule 9). Pull again while `hasMore`.
  operationId: syncPull
  security:
    - bearerAuth: []
  parameters:
    - name: since
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 500
    - name: deviceId
      in: query
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: The changes and the next cursor
      content:
        application/json:
          schema:
            $ref: '../../components/models/sync-pull-response.schema.yaml'
    '401':
      $ref: '../../components/responses/error.response.yaml'
    '410':
      description: >-
        `CURSOR_EXPIRED`: `since` is older than the tombstone retention; clear the synced tables
        and pull from 0
      content:
        application/json:
          schema:
            $ref: '../../components/models/error.schema.yaml'
    '422':
      $ref: '../../components/responses/error.response.yaml'
