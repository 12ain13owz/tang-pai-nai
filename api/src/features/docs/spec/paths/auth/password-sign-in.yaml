post:
  tags:
    - Auth
  summary: Sign in with email and password
  description: >-
    For users who set a password. Unknown email, wrong password and "no password set" all answer
    the same `400 INVALID_CREDENTIALS` with the same timing. Limits count failures: 5 per email and
    30 per IP per 15 minutes, after which every attempt is `429` until the window ends. A hash made
    with older Argon2 parameters is upgraded on success.
  operationId: passwordSignIn
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/models/auth-password-sign-in.schema.yaml'
  responses:
    '200':
      description: Signed in; sets the `__Host-rt` refresh cookie
      headers:
        Set-Cookie:
          schema:
            type: string
            example: __Host-rt=…; Path=/; Expires=…; HttpOnly; Secure; SameSite=Strict
      content:
        application/json:
          schema:
            $ref: '../../components/models/auth-session-response.schema.yaml'
    '400':
      description: '`INVALID_CREDENTIALS`'
      content:
        application/json:
          schema:
            $ref: '../../components/models/error.schema.yaml'
    '403':
      description: '`USER_DISABLED`, after the password was checked'
      content:
        application/json:
          schema:
            $ref: '../../components/models/error.schema.yaml'
    '422':
      $ref: '../../components/responses/error.response.yaml'
    '429':
      $ref: '../../components/responses/too-many-requests.response.yaml'
