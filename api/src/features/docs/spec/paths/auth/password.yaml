put:
  tags:
    - Auth
  summary: Set or change the password
  description: >-
    Needs recent authentication: the session's last credential check ≤ 10 minutes ago (sign-in,
    or a step-up code from `/auth/reauth/*`), or a correct `currentPassword`. The new password is
    judged first (`422` with a `PASSWORD_*` code), then the proof (`403 REAUTH_REQUIRED`). On
    success every other session family of the user is revoked; this one stays, and the user gets
    a mail about the change (rule 31).
  operationId: passwordSet
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/models/auth-password-set.schema.yaml'
  responses:
    '200':
      description: Saved; the user with `hasPassword` true
      content:
        application/json:
          schema:
            $ref: '../../components/models/auth-user-response.schema.yaml'
    '400':
      description: '`CURRENT_PASSWORD_INVALID` (counts toward the per-email failure limit)'
      content:
        application/json:
          schema:
            $ref: '../../components/models/error.schema.yaml'
    '401':
      description: Access token invalid, or its session was revoked or expired
      content:
        application/json:
          schema:
            $ref: '../../components/models/error.schema.yaml'
    '403':
      description: '`REAUTH_REQUIRED`, or `USER_DISABLED`'
      content:
        application/json:
          schema:
            $ref: '../../components/models/error.schema.yaml'
    '422':
      description: >-
        Invalid body, or the policy refused the password: `PASSWORD_TOO_SHORT`,
        `PASSWORD_TOO_LONG`, `PASSWORD_TOO_WEAK`, `PASSWORD_MATCHES_EMAIL`, `PASSWORD_BREACHED`
      content:
        application/json:
          schema:
            $ref: '../../components/models/error.schema.yaml'
    '429':
      $ref: '../../components/responses/too-many-requests.response.yaml'
delete:
  tags:
    - Auth
  summary: Remove the password
  description: >-
    Same recent-auth rule as `PUT`. Other sessions stay; the user gets a mail about the change.
    Without a password it's a no-op `200`.
  operationId: passwordRemove
  security:
    - bearerAuth: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: '../../components/models/auth-recent-auth.schema.yaml'
  responses:
    '200':
      description: Removed; the user with `hasPassword` false
      content:
        application/json:
          schema:
            $ref: '../../components/models/auth-user-response.schema.yaml'
    '400':
      description: '`CURRENT_PASSWORD_INVALID`'
      content:
        application/json:
          schema:
            $ref: '../../components/models/error.schema.yaml'
    '401':
      $ref: '../../components/responses/error.response.yaml'
    '403':
      description: '`REAUTH_REQUIRED`, or `USER_DISABLED`'
      content:
        application/json:
          schema:
            $ref: '../../components/models/error.schema.yaml'
    '429':
      $ref: '../../components/responses/too-many-requests.response.yaml'
