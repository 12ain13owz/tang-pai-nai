get:
  tags:
    - Sharing
  summary: 'Invites to me and wallets shared with me'
  description: >-
    Pending invites to the caller’s verified email, and the live, open wallets shared with them with server-computed balances.
  operationId: sharingWithMe
  security:
    - bearerAuth: []
  responses:
    '200':
      description: 'What is shared with the caller'
      content:
        application/json:
          schema:
            $ref: '../../components/models/sharing-with-me-response.schema.yaml'
    '401':
      $ref: '../../components/responses/error.response.yaml'
