get:
  tags:
    - Sharing
  summary: 'Owner view of a profile'
  description: >-
    Members (one role each, their open wallets), pending invites and open wallets shared with nobody (docs/features/sharing.md).
  operationId: sharingOfProfile
  security:
    - bearerAuth: []
  parameters:
    - name: profileId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    '200':
      description: 'The profile’s sharing'
      content:
        application/json:
          schema:
            $ref: '../../components/models/sharing-owner-response.schema.yaml'
    '401':
      $ref: '../../components/responses/error.response.yaml'
    '404':
      description: 'Not the caller’s to see (404 hides whether it exists)'
      content:
        application/json:
          schema:
            $ref: '../../components/models/error.schema.yaml'
