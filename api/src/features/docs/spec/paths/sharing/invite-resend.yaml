post:
  tags:
    - Sharing
  summary: 'Send an invite again'
  description: >-
    Mails the invitee again 10 minutes after the last send at the earliest (`SHARE_RESEND_COOLDOWN`), within the daily limits (`SHARE_DAILY_LIMIT`, `RATE_LIMITED`). The expiry stays.
  operationId: sharingResendInvite
  security:
    - bearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: '../../components/models/sharing-lang.schema.yaml'
  responses:
    '200':
      description: 'Done'
      content:
        application/json:
          schema:
            $ref: '../../components/models/message-response.schema.yaml'
    '401':
      $ref: '../../components/responses/error.response.yaml'
    '404':
      description: 'Not the caller’s to see (404 hides whether it exists)'
      content:
        application/json:
          schema:
            $ref: '../../components/models/error.schema.yaml'
    '429':
      $ref: '../../components/responses/too-many-requests.response.yaml'
