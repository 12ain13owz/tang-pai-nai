get:
  tags:
    - Sharing
  summary: 'A wallet shared with me'
  description: >-
    The wallet with its balance and first entry day, the caller’s role, the owner, and the owner’s categories of that profile.
  operationId: sharingWallet
  security:
    - bearerAuth: []
  parameters:
    - name: walletId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    '200':
      description: 'The wallet'
      content:
        application/json:
          schema:
            $ref: '../../components/models/sharing-wallet-response.schema.yaml'
    '401':
      $ref: '../../components/responses/error.response.yaml'
    '404':
      description: 'Not the caller’s to see (404 hides whether it exists)'
      content:
        application/json:
          schema:
            $ref: '../../components/models/error.schema.yaml'
