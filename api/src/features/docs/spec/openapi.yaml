openapi: 3.1.0
info:
  title: NodeJS Template API
  version: 1.0.0
  description: API documentation for the Node.js template project

servers:
  - url: http://localhost:3000

tags:
  - name: Health
    description: Service health checks
  - name: Auth
    description: Email code / magic-link / password sign-in and sessions (docs/features/auth.md)
  - name: Todo
    description: Reference CRUD feature (in-memory, resets on restart)

paths:
  /health:
    $ref: './paths/health/health.yaml'
  /auth/email/start:
    $ref: './paths/auth/email-start.yaml'
  /auth/email/verify:
    $ref: './paths/auth/email-verify.yaml'
  /auth/password/sign-in:
    $ref: './paths/auth/password-sign-in.yaml'
  /auth/password:
    $ref: './paths/auth/password.yaml'
  /auth/reauth/start:
    $ref: './paths/auth/reauth-start.yaml'
  /auth/reauth/verify:
    $ref: './paths/auth/reauth-verify.yaml'
  /auth/refresh:
    $ref: './paths/auth/refresh.yaml'
  /auth/sign-out:
    $ref: './paths/auth/sign-out.yaml'
  /auth/me:
    $ref: './paths/auth/me.yaml'
  /todos:
    $ref: './paths/todo/todos.yaml'
  /todos/{id}:
    $ref: './paths/todo/todo-by-id.yaml'
  /todos/{id}/toggle:
    $ref: './paths/todo/todo-toggle.yaml'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from sign-in or refresh (10 minutes)
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Host-rt
      description: Opaque refresh token, set by the API; never readable by the web app
  schemas:
    HealthResponse:
      $ref: './components/models/health.schema.yaml'
    Error:
      $ref: './components/models/error.schema.yaml'
    Todo:
      $ref: './components/models/todo.schema.yaml'
    CreateTodoRequest:
      $ref: './components/models/todo-create.schema.yaml'
    AuthUser:
      $ref: './components/models/auth-user.schema.yaml'
    AuthSessionResponse:
      $ref: './components/models/auth-session-response.schema.yaml'
  responses:
    SuccessResponse:
      $ref: './components/responses/success.response.yaml'
    ErrorResponse:
      $ref: './components/responses/error.response.yaml'
    TooManyRequests:
      $ref: './components/responses/too-many-requests.response.yaml'
