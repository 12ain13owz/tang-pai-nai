openapi: 3.1.0
info:
  title: NodeJS Template API
  version: 1.0.0
  description: API documentation for the Node.js template project

servers:
  - url: http://localhost:3000

tags:
  - name: Health
    description: Service health checks
  - name: Auth
    description: >-
      Email code / magic-link / password / Google / phone (SMS) sign-in, sessions and Account ›
      Security
      (docs/features/auth.md)
  - name: Currency
    description: Master list of currencies (docs/features/currency.md)
  - name: Sync
    description: Offline sync, push then pull (docs/features/offline-sync.md)
  - name: Todo
    description: Reference CRUD feature (in-memory, resets on restart)

paths:
  /health:
    $ref: './paths/health/health.yaml'
  /auth/email/start:
    $ref: './paths/auth/email-start.yaml'
  /auth/email/verify:
    $ref: './paths/auth/email-verify.yaml'
  /auth/password/sign-in:
    $ref: './paths/auth/password-sign-in.yaml'
  /auth/password:
    $ref: './paths/auth/password.yaml'
  /auth/reauth/start:
    $ref: './paths/auth/reauth-start.yaml'
  /auth/reauth/verify:
    $ref: './paths/auth/reauth-verify.yaml'
  /auth/phone/start:
    $ref: './paths/auth/phone-start.yaml'
  /auth/phone/verify:
    $ref: './paths/auth/phone-verify.yaml'
  /auth/phone:
    $ref: './paths/auth/phone.yaml'
  /auth/phone/confirm:
    $ref: './paths/auth/phone-confirm.yaml'
  /auth/refresh:
    $ref: './paths/auth/refresh.yaml'
  /auth/sign-out:
    $ref: './paths/auth/sign-out.yaml'
  /auth/me:
    $ref: './paths/auth/me.yaml'
  /auth/providers:
    $ref: './paths/auth/providers.yaml'
  /auth/google/start:
    $ref: './paths/auth/google-start.yaml'
  /auth/google/callback:
    $ref: './paths/auth/google-callback.yaml'
  /auth/google/link:
    $ref: './paths/auth/google-link.yaml'
  /auth/sessions:
    $ref: './paths/auth/sessions.yaml'
  /auth/sessions/{id}:
    $ref: './paths/auth/session.yaml'
  /currencies:
    $ref: './paths/currency/currencies.yaml'
  /sync/pull:
    $ref: './paths/sync/pull.yaml'
  /sync/push:
    $ref: './paths/sync/push.yaml'
  /todos:
    $ref: './paths/todo/todos.yaml'
  /todos/{id}:
    $ref: './paths/todo/todo-by-id.yaml'
  /todos/{id}/toggle:
    $ref: './paths/todo/todo-toggle.yaml'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from sign-in or refresh (10 minutes)
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Host-rt
      description: Opaque refresh token, set by the API; never readable by the web app
    googleFlowCookie:
      type: apiKey
      in: cookie
      name: __Host-goidc
      description: Sealed state, nonce and PKCE verifier of one Google round trip (10 minutes)
  schemas:
    HealthResponse:
      $ref: './components/models/health.schema.yaml'
    Error:
      $ref: './components/models/error.schema.yaml'
    Todo:
      $ref: './components/models/todo.schema.yaml'
    CreateTodoRequest:
      $ref: './components/models/todo-create.schema.yaml'
    AuthUser:
      $ref: './components/models/auth-user.schema.yaml'
    AuthSessionResponse:
      $ref: './components/models/auth-session-response.schema.yaml'
    AuthIdentity:
      $ref: './components/models/auth-identity.schema.yaml'
    Currency:
      $ref: './components/models/currency.schema.yaml'
    SyncRow:
      $ref: './components/models/sync-row.schema.yaml'
    SyncPushRequest:
      $ref: './components/models/sync-push.schema.yaml'
    SyncProfileRow:
      $ref: './components/models/sync-profile-row.schema.yaml'
  responses:
    SuccessResponse:
      $ref: './components/responses/success.response.yaml'
    ErrorResponse:
      $ref: './components/responses/error.response.yaml'
    TooManyRequests:
      $ref: './components/responses/too-many-requests.response.yaml'
