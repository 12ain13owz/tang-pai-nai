type: object
required: [email, role, walletIds]
properties:
  email: { type: string, format: email, description: Trimmed and lowercased }
  role: { $ref: './sharing-role.schema.yaml' }
  walletIds:
    type: array
    minItems: 1
    maxItems: 200
    description: Open, live wallets of the profile
    items: { type: string, format: uuid }
  lang: { type: string, enum: [th, en], default: th, description: Language of the mail }
