type: object
required: [newPassword]
properties:
  newPassword:
    type: string
    description: >-
      8–128 characters (code points) with a lowercase letter, an uppercase letter, a digit and one
      other character; not the email or its local part; not in a known breach (HIBP).
    example: Gr33n Mango Tree
  currentPassword:
    type: string
    description: >-
      Proves recent authentication when the session's last credential check is older than 10
      minutes (only for a user who has a password).
  lang:
    type: string
    enum: [th, en]
    default: th
    description: Language of the mail that tells the user about the change (auth spec rule 31)
