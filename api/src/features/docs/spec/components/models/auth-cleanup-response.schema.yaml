type: object
required: [message, timestamp, data]
properties:
  message:
    type: string
    example: Operation successful
  timestamp:
    type: string
    format: date-time
    example: '2026-01-01T00:00:00.000Z'
  data:
    type: object
    required: [challenges, sessions, rateLimitBuckets]
    properties:
      challenges:
        type: integer
        example: 12
      sessions:
        type: integer
        example: 3
      rateLimitBuckets:
        type: integer
        example: 40
