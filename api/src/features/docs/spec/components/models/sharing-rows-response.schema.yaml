type: object
required: [message, timestamp, data]
properties:
  message: { type: string, example: Listed rows successfully }
  timestamp: { type: string, format: date-time }
  data:
    type: object
    required: [profile, role, owner, people, wallets, categories, transactions, cursor, hasMore]
    properties:
      profile: { $ref: './sharing-profile.schema.yaml' }
      role: { $ref: './sharing-role.schema.yaml' }
      owner:
        type: object
        properties:
          id: { type: string, format: uuid }
          displayName: { type: string }
          email: { type: string, format: email }
      people:
        type: array
        description: The owner and the profile's members, the names behind `addedBy`
        items:
          type: object
          properties:
            id: { type: string, format: uuid }
            displayName: { type: string }
      wallets:
        type: array
        description: >-
          The shared wallets as `/sync/pull` sends them (no `userId`), transfers and debt
          entries folded into `initialBalance`
        items: { $ref: './sync-row.schema.yaml' }
      categories:
        type: array
        description: The owner's live categories of the profile, archived ones too
        items: { $ref: './sync-row.schema.yaml' }
      transactions:
        type: object
        description: >-
          The wallets' transactions with `changeSeq > since`, tombstones included, by
          `changeSeq`: one array per row, in `columns`' order
        required: [columns, rows]
        properties:
          columns: { type: array, items: { type: string } }
          rows:
            type: array
            items: { type: array, items: {} }
      cursor: { type: integer, description: The last `changeSeq` read; the next `since` }
      hasMore: { type: boolean }
