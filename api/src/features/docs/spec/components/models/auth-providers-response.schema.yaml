type: object
required: [message, timestamp, data]
properties:
  message:
    type: string
    example: Sign-in providers
  timestamp:
    type: string
    format: date-time
    example: '2026-01-01T00:00:00.000Z'
  data:
    type: object
    required: [google, phone]
    properties:
      google:
        type: boolean
        description: >-
          Whether Google sign-in is on (`GOOGLE_CLIENT_ID` and `GOOGLE_CLIENT_SECRET` are set)
        example: true
      phone:
        type: boolean
        description: >-
          Whether phone sign-in and adding a number are on (`SMS_PROVIDER` isn't `disabled`)
        example: true
