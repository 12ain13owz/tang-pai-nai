type: object
description: >-
  A row of the `debt_entries` table (docs/features/debt.md) as it travels in /sync/pull and in
  /sync/push: money of a debt that is not income or expense (borrowed or lent, more of it, paid
  or received back). It moves its wallet's balance like a transfer side. Rules (each answers
  `CONFLICT`): profileId is one of the user's live profiles and never changes; debtId is a live
  debt of the user in that profile and never changes; walletId is a live wallet of the profile
  in the debt's currency (archived accepted), and null only on a `repaid` debt. An entry pushed
  after its debt was deleted is stored as a tombstone with the debt, not refused. A tombstone
  runs none of them. A live entry fixes its wallet's currency.
required:
  [
    id,
    profileId,
    debtId,
    kind,
    walletId,
    amount,
    occurredOn,
    note,
    createdAt,
    updatedAt,
    deletedAt,
    changeSeq,
    updatedBy,
  ]
properties:
  id:
    type: string
    format: uuid
  profileId:
    type: string
    format: uuid
  debtId:
    type: string
    format: uuid
  kind:
    type: string
    enum: [principal, repayment]
    description: Borrowed / lent (more), or paid / received back
  walletId:
    type: [string, 'null']
    format: uuid
    description: >-
      The wallet the money came into or left; null only on a `repaid` debt (its principal: no
      money came in; or a forgiven rest)
  amount:
    type: integer
    minimum: 1
    maximum: 1000000000000000
  occurredOn:
    type: string
    format: date
  note:
    type: string
    maxLength: 500
  recurringId:
    type: [string, 'null']
    format: uuid
    description: >-
      The `debt` recurring rule this repayment is an occurrence of, null otherwise; as for
      transactions, a create of an id the server already has keeps the stored row, no notice.
  createdAt:
    type: integer
  updatedAt:
    type: integer
  deletedAt:
    type: [integer, 'null']
  changeSeq:
    type: integer
  updatedBy:
    type: string
example:
  id: 0199b000-0000-7000-8000-000000000801
  profileId: 0199b000-0000-7000-8000-000000000001
  debtId: 0199b000-0000-7000-8000-000000000701
  kind: repayment
  walletId: 0199b000-0000-7000-8000-000000000101
  amount: 200000
  occurredOn: '2026-10-15'
  note: ''
  recurringId: null
  createdAt: 1793600000000
  updatedAt: 1793600000000
  deletedAt: null
  changeSeq: 902
  updatedBy: 0199b000-0000-7000-8000-00000000a001
