type: object
required: [id, email, displayName, avatarUrl, timezone, hasPassword, identities]
properties:
  id:
    type: string
    description: UUIDv7
    example: 01929b6e-5c3a-7c2e-9f1a-3b4c5d6e7f80
  email:
    type: string
    format: email
    example: mom@example.com
  displayName:
    type: string
    description: >-
      The email's local part, or the Google name when the account was created through Google
    example: mom
  avatarUrl:
    type: [string, 'null']
    description: The Google picture when the account was created (or linked) through Google
    example: null
  timezone:
    type: string
    example: Asia/Bangkok
  hasPassword:
    type: boolean
    description: Whether the user has set a password (and can sign in with it)
    example: false
  identities:
    type: array
    description: Linked sign-in providers, oldest first; empty when none
    items:
      $ref: './auth-identity.schema.yaml'
