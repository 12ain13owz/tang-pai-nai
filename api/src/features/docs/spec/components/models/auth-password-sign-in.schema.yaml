type: object
required: [email, password]
properties:
  email:
    type: string
    format: email
    description: Trimmed and lowercased before use
    example: mom@example.com
  password:
    type: string
    minLength: 1
    maxLength: 1024
    description: Sent as typed (never trimmed); the policy isn't checked at sign-in
    example: Gr33n Mango Tree
